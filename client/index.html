<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060f" />
    <meta
      name="description"
      content="The Ascension — turn daily effort into tiers, streaks and bragging rights."
    />
    <title>The Ascension | Gamified Productivity</title>

    <!--
      Icons. Every file here is generated by client/scripts/render-icons.mjs
      (`npm run icons`); the SVG and the PNG rasters come from one set of bezier
      control points, so they cannot drift apart. Edit the script, not the files.

      Order matters and is not alphabetical. The SVG comes FIRST, followed by
      the PNGs. Browsers that understand SVG pick the first rel="icon" they can
      render; the raster sizes are there for everything else, and this ordering
      is the one every major engine actually honours. Note the sizes are listed
      largest-first, which also happens to be what a high-DPI display asks for.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Safari and iOS ignore every rel="icon" above and read only this one. It
         must be a real PNG, which is the main reason the rasters exist at all. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Pinned-tab silhouette for Chromium, which recolours the icon's alpha to
         match the tab strip. A separate file, not favicon.svg: a mask keeps
         only the alpha channel, so favicon.svg's dark rounded badge would
         flatten into a solid square and the flame would vanish inside it. -->
    <link rel="mask-icon" href="/favicon-mask.svg" color="#22d3ee" />

    <!--
      Maskable / PWA sources. These are not linked as icons: a web manifest is
      what tells Android about them, and declaring one would opt the app into
      install prompts and a service-worker lifecycle that is out of scope here.
      The 512 maskable raster exists with its wider safe zone so adding a
      manifest later is a config change rather than a redesign.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
